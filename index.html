<style>

.app{max-width:1320px;margin:0 auto;padding:30px 28px 60px}.screen{min-height:calc(100vh - 150px);display:grid;align-items:center}.paper{background:var(--cream);border:1px solid #e2d6c5;box-shadow:var(--shadow);padding:48px;position:relative}.paper:after{content:"";position:absolute;inset:10px;border:1px solid rgba(19,32,49,.07);pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:800;color:#c9542d;margin:0 0 10px}h1,h2,h3{margin:0;letter-spacing:-.035em}h1{font-size:clamp(42px,6vw,76px);line-height:.92}h2{font-size:clamp(34px,4.6vw,60px);line-height:1}p{line-height:1.5}.lead{font-size:19px;max-width:700px}.primary,.secondary,.ghost{border:1px solid transparent;min-height:52px;padding:0 24px;text-transform:uppercase;font-size:11px;letter-spacing:.08em;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:var(--navy);color:#fff}.ghost{background:transparent;border-color:#9c9488;color:var(--ink)}
.intro,.name{grid-template-columns:minmax(340px,.85fr) minmax(560px,1.15fr);gap:24px;overflow:visible}.hero-art{position:relative;min-height:670px}.hero-art img{position:absolute;width:clamp(420px,38vw,600px);left:-3%;bottom:-35px;filter:drop-shadow(0 24px 25px rgba(0,0,0,.25))}.name-input{width:100%;border:0;border-bottom:2px solid var(--accent);background:transparent;font-size:30px;padding:14px 2px;margin:10px 0 30px;outline:none}
.signal-pick{display:block;min-height:auto}.signal-pick .paper{padding:36px 42px 42px}.signal-header{display:grid;grid-template-columns:1fr 280px;gap:24px;align-items:center}.signal-header img{width:280px;height:210px;object-fit:contain}.signal-tag{display:inline-block;padding:8px 12px;font-size:11px;font-weight:800;letter-spacing:.1em;border:1px solid #c8bfb2;margin-bottom:12px}.signal-tag.low{background:var(--low)}.signal-tag.steady{background:var(--steady)}.signal-tag.rising{background:var(--rising)}.signal-tag.overload{background:var(--overload)}
.feeling-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:28px 0 18px}.feeling{min-height:250px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;cursor:pointer;position:relative}.feeling:hover{transform:translateY(-2px);border-color:#788494}.feeling img{width:190px;height:165px;object-fit:contain}.feeling strong{font-size:18px}.feeling.selected{border:4px solid var(--navy);background:#edf1f4}.feeling.selected:after{content:"✓";position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:800}.other-feeling{margin-top:14px;display:grid;grid-template-columns:220px 1fr;gap:14px}.other-tile{background:#fff;border:1px solid var(--line);padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer}.plus{font-size:34px;width:54px;height:54px;border:1px solid #aaa;display:grid;place-items:center}.other-input{background:#fff;border:1px solid var(--line);padding:18px}.other-input input{width:100%;border:0;border-bottom:2px solid var(--accent);font-size:22px;padding:8px 2px;outline:none}.pick-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}
.q-screen{grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:stretch}.q-rail{color:#fff;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);padding:26px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:680px}.q-rail img{width:260px;height:265px;object-fit:contain;margin:24px auto 14px}.q-rail .stage{font-size:11px;letter-spacing:.15em;font-weight:800;margin-top:18px}.q-rail h3{font-size:30px;margin:8px 0}.q-rail p{font-size:13px;color:#dce4ec}.q-card{min-height:680px;background:var(--cream);border:1px solid #e2d6c5;box-shadow:var(--shadow);padding:44px;display:flex;flex-direction:column;justify-content:center}.q-count{font-size:10px;letter-spacing:.15em;font-weight:800;color:#c9542d;margin-bottom:12px}.q-card h2{max-width:900px}.focus-card{margin:34px auto 28px;width:min(650px,100%);background:#fff;border:1px solid var(--line);padding:28px;display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:center}.focus-card img{width:230px;height:220px;object-fit:contain}.focus-card .big-label{font-size:26px;font-weight:800;line-height:1.1}.focus-card .small{font-size:13px;color:var(--muted);margin-top:8px}.yn{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:min(650px,100%);margin:0 auto}.yn button{min-height:86px;border:0;font-size:20px;font-weight:900;cursor:pointer}.yes{background:#e5f1eb;color:#175d44;border:2px solid #72a78f!important}.no{background:#f6e9e9;color:#7d3030;border:2px solid #c99393!important}.yn button:hover{transform:translateY(-2px)}.skip-note{text-align:center;font-size:11px;color:var(--muted);margin-top:12px}.free-card{display:grid;gap:18px}.free-card textarea{width:100%;min-height:140px;border:1px solid var(--line);padding:16px;font-size:18px;resize:vertical}.free-actions{display:flex;justify-content:flex-end;gap:12px}
.signal-done{place-items:center}.done-card{width:min(780px,100%);text-align:center}.done-card img{width:320px;height:240px;object-fit:contain;margin-bottom:14px}.done-card p{font-size:18px}.done-actions{display:flex;justify-content:center;gap:12px;margin-top:24px}
.report-screen{display:block;min-height:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.report{background:var(--paper);padding:34px;box-shadow:var(--shadow)}.page{max-width:1100px;margin:0 auto 26px;padding:30px;background:#fffaf2;border:1px solid #bfb7aa}.report-head{display:flex;justify-content:space-between;gap:18px;border-bottom:2px solid #1b2e42;padding-bottom:16px;margin-bottom:18px}.report-title{font-size:40px}.report-id{text-align:right;font-size:10px;letter-spacing:.08em;line-height:1.5}.intro-box{display:grid;grid-template-columns:1fr 300px;gap:18px;border:1px solid #d4c9b9;background:#fff;padding:18px}.intro-box img{width:100%;height:180px;object-fit:contain}.note{font-size:11px;line-height:1.5;color:#45515e}.defs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.def{padding:12px;border:1px solid #c8bfb2;font-size:10.5px;line-height:1.4}.def.low{background:var(--low)}.def.steady{background:var(--steady)}.def.rising{background:var(--rising)}.def.overload{background:var(--overload)}.def strong{display:block;font-size:12px;margin-bottom:5px}
.cycle{margin-top:24px;border:1px solid #c5bcaf;background:#fff;padding:18px}.cycle h3{font-size:24px;margin-bottom:4px}.cycle-curve{width:100%;height:210px;display:block}.cycle-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:-6px}.cycle-label{text-align:center;font-size:10px;font-weight:800;letter-spacing:.08em}.cycle-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.cycle-card{border:1px solid #c9c0b3;padding:10px;font-size:9.5px;line-height:1.35;min-height:170px}.cycle-card.low{background:var(--low)}.cycle-card.steady{background:var(--steady)}.cycle-card.rising{background:var(--rising)}.cycle-card.overload{background:var(--overload)}.cycle-card.recovery{background:#eef1f3}.cycle-card strong{display:block;font-size:11px;margin-bottom:5px}.cycle-card b{display:block;margin-top:7px;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{background:#fff;border:1px solid #d1c7ba;padding:4px 6px;font-size:9.5px}.signal-section{border:1px solid #bfb7aa;margin:15px 0}.signal-section header{padding:12px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #c6bdae}.signal-section header.low{background:var(--low)}.signal-section header.steady{background:var(--steady)}.signal-section header.rising{background:var(--rising)}.signal-section header.overload{background:var(--overload)}.signal-section header img{width:76px;height:60px;object-fit:contain}.signal-section h3{font-size:22px}.signal-body{padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.block{border-top:1px solid #ded5c8;padding-top:8px}.block h4{margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.1em}.student-note{grid-column:1/-1;background:#fff;border-left:3px solid var(--accent);padding:10px;font-size:11px}.adult-summary{border:2px solid var(--accent);padding:16px;margin:16px 0}.adult-summary h3{margin-bottom:8px}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary-card{border:1px solid #c8bfb2;padding:10px;font-size:10px}
@media(max-width:980px){.intro,.name,.q-screen{grid-template-columns:1fr}.hero-art{min-height:300px;order:2}.hero-art img{width:330px;left:50%;transform:translateX(-50%);bottom:-45px}.feeling-grid{grid-template-columns:repeat(2,1fr)}.signal-header{grid-template-columns:1fr}.signal-header img{justify-self:center}.q-rail{min-height:auto}.q-card{min-height:auto}.cycle-cards{grid-template-columns:1fr 1fr}.cycle-curve,.cycle-labels{display:none}}
@media(max-width:600px){.app{padding:20px 12px 40px}.paper,.q-card{padding:24px 18px}.feeling-grid{grid-template-columns:1fr 1fr;gap:8px}.feeling{min-height:180px;padding:10px}.feeling img{width:125px;height:120px}.other-feeling{grid-template-columns:1fr}.focus-card{grid-template-columns:1fr;text-align:center}.focus-card img{margin:auto}.yn{grid-template-columns:1fr}.defs{grid-template-columns:1fr 1fr}.signal-body,.summary-grid{grid-template-columns:1fr}.intro-box{grid-template-columns:1fr}.cycle-cards{grid-template-columns:1fr}}
@media print{@page{size:A4;margin:10mm}html,body,.shell{background:#fff!important}.topbar,.progress,.toolbar{display:none!important}.app{max-width:none;padding:0}.screen{min-height:auto;display:block}.report{box-shadow:none;padding:0}.page{border:0;margin:0;padding:0;max-width:none}.page-break{page-break-before:always}.cycle{page-break-inside:avoid}.signal-section{page-break-inside:avoid}}

<body>
<div class="shell">
<header class="topbar"><div class="brand">ZORBAX-9 RESEARCH DIVISION</div><div><button id="readBtn">🔊 READ ALOUD</button><button id="startOver">START OVER</button></div></header>
<div id="progress" class="progress hidden"><div class="progress-meta"><span id="pLabel"></span><span id="pCount"></span></div><div class="track"><div id="pBar" class="bar"></div></div></div>
<main id="app" class="app" aria-live="polite"></main>
</div>
<script>
const app=document.getElementById('app'),progress=document.getElementById('progress'),pLabel=document.getElementById('pLabel'),pCount=document.getElementById('pCount'),pBar=document.getElementById('pBar');
const STORAGE_KEY='glorbSignalMapperV7';
const SIGNALS=['low','steady','rising','overload'];
const signalInfo={
 low:{label:'LOW SIGNAL',img:3,definition:'Energy or attention may be dropping. The student may need recovery, help getting started, or a change in demand.'},
 steady:{label:'STEADY SIGNAL',img:4,definition:'The student has enough capacity for the current situation. Steady does not have to mean silent, still, or perfectly calm.'},
 rising:{label:'RISING SIGNAL',img:5,definition:'An early warning signal. Activation, tension, speed, or urgency is increasing. Support at this stage can help before overload.'},
 overload:{label:'SIGNAL OVERLOAD',img:6,definition:'Thinking, language and flexible responding may be much harder. Prioritise safety, reduce demands and language, and return to reflection later.'}
};
const FEELINGS={
 low:[{id:'upset',label:'Upset',img:12},{id:'sad',label:'Sad',img:18},{id:'lonely',label:'Lonely',img:20},{id:'bored',label:'Bored',img:21},{id:'tired',label:'Tired',img:22},{id:'unsure',label:'Unsure',img:23}],
 steady:[{id:'calm',label:'Calm',img:24},{id:'focused',label:'Focused',img:25},{id:'proud',label:'Proud',img:26},{id:'content',label:'Content',img:27}],
 rising:[{id:'disrespected',label:'Disrespected',img:13},{id:'excited',label:'Excited',img:14},{id:'frustrated',label:'Frustrated',img:15},{id:'anxious',label:'Anxious',img:16},{id:'nervous',label:'Nervous',img:17},{id:'embarrassed',label:'Embarrassed',img:19}],
 overload:[{id:'furious',label:'Furious',img:6},{id:'panicked',label:'Panicked',img:6},{id:'terrified',label:'Terrified',img:6},{id:'overwhelmed',label:'Overwhelmed',img:11}]
};
const COMMON={
 body:{
  low:[['My body feels heavy or tired',46],['My breathing feels slow or shallow',40],['My eyes feel tired',47],['My body wants to be still',28],['It is hard to get started',39],['My head feels foggy',33]],
  steady:[['My body feels comfortable',49],['My breathing feels easy',50],['My energy feels steady',53],['My head feels clear',52],['My muscles feel relaxed',49],['I can notice what is happening around me',54]],
  rising:[['My heart beats faster',55],['My breathing gets faster or shaky',30],['My face or body feels hot',31],['My muscles, jaw or hands get tight',61],['My body feels fidgety',58],['My voice or movements speed up',57]],
  overload:[['It is hard to think clearly',32],['It is hard to talk',33],['My body shakes or trembles',59],['My body freezes or shuts down',36],['Everything feels too loud or too much',35],['My body feels out of control',29]]
 },
 urge:{
  low:[['Put my head down or stop',39],['Rest or slow down',88],['Be alone for a bit',43],['Stop joining in',36],['Do something easier',84]],
  steady:[['Keep doing what I am doing',79],['Join in or take part',80],['Talk to people',80],['Try something challenging',81],['Ask for help if I need it',67]],
  rising:[['Move, walk or pace',74],['Get away or leave',73],['Go quiet',28],['Argue or yell',57],['Cry',36],['Squeeze or push something safely',69]],
  overload:[['Run or get away',38],['Yell',57],['Cry',36],['Hide or curl up',36],['Freeze or stop talking',28],['Push people away or fight',29]]
 },
 bigger:{
  low:[['Lots of noise or people',0],['Being rushed',0],['Work feeling too hard',0],['Not knowing what to do',0],['Being tired, hungry or unwell',0]],
  steady:[],
  rising:[['Being rushed',0],['Lots of questions',0],['Being corrected in front of people',0],['Someone standing too close',0],['Plans changing suddenly',0],['Feeling ignored or misunderstood',0]],
  overload:[['Lots of talking',0],['Lots of questions',0],['Being touched when I do not want to be',0],['Being told to explain straight away',0],['Someone raising their voice',0],['More demands being added',0]]
 },
 self:{
  low:[['Rest for a few minutes',88],['Get water or my usual snack',87],['Do gentle movement',74],['Go somewhere quieter',83],['Talk to someone I trust',85]],
  steady:[['Keep doing what is working',79],['Have a predictable routine',84],['Take movement breaks',74],['Use a fidget if it helps',77],['Have clear instructions',106]],
  rising:[['Take a short break',76],['Step away for a moment',73],['Move my body',74],['Go somewhere quieter',83],['Use slow comfortable breathing if it helps',72],['Use a fidget or something for my hands',77]],
  overload:[['Go to a safe quiet space',83],['Have time before talking',71],['Use strong muscle movement if it helps and is safe',69],['Rest',88],['Have less happening around me',84]]
 },
 others:{
  low:[['Give me time',71],['Help me get started',106],['Check in quietly',107],['Use fewer words',107],['Help me know the next step',106]],
  steady:[['Give clear instructions',106],['Let me use supports that work',77],['Give me predictable information',106],['Let me move when I need to',99],['Notice what is going well',80]],
  rising:[['Give me some space',73],['Use fewer words',107],['Talk quietly',107],['Let me take a break',99],['Help me leave the situation',73],['Check on me later',109]],
  overload:[['Keep the space quiet',83],['Use very few words',107],['Give me more space',73],['Stay nearby without lots of talking',103],['Wait until later to talk about what happened',109],['Help keep me safe',100]]
 },
 recovery:[['I feel tired afterwards',46],['I need quiet time',83],['I need food or water',87],['I need time before talking',71],['Doing something familiar helps',84],['It helps when someone checks on me later',109]]
};
const SECTION_LABEL={body:'BODY CLUES',urge:'WHAT I WANT TO DO',bigger:'WHAT CAN MAKE IT BUILD',self:'WHAT HELPS ME',others:'WHAT OTHER PEOPLE CAN DO',recovery:'RECOVERY'};
function asset(n){return `assets/${n}.webp`}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function blankState(){return{stage:'intro',name:'',signalIndex:0,picks:{},answers:{},free:{},recovery:{},q:{sectionIndex:0,itemIndex:0}}}let state=load()||blankState();
function load(){try{return JSON.parse(sessionStorage.getItem(STORAGE_KEY))}catch{return null}}function save(){sessionStorage.setItem(STORAGE_KEY,JSON.stringify(state))}function reset(){sessionStorage.removeItem(STORAGE_KEY);state=blankState();render()}
function feelingFor(sig){const id=state.picks[sig]?.id;if(!id)return null;if(id==='other')return{id:'other',label:state.picks[sig].label||'My feeling',img:signalInfo[sig].img};return FEELINGS[sig].find(x=>x.id===id)}
function ensureAnswer(sig){state.answers[sig]??={};return state.answers[sig]}
function sectionOrder(sig){return sig==='steady'?['body','urge','self','others']:['body','urge','bigger','self','others']}
function currentSig(){return SIGNALS[state.signalIndex]}
function allQuestionItemsCount(){let n=0;for(const sig of SIGNALS){for(const sec of sectionOrder(sig))n+=COMMON[sec][sig].length}n+=COMMON.recovery.length;return n}
function completedQuestionItems(){let n=0;for(let si=0;si<state.signalIndex;si++){const sig=SIGNALS[si];for(const sec of sectionOrder(sig))n+=COMMON[sec][sig].length}if(state.stage==='questions'){const sig=currentSig(),secs=sectionOrder(sig);for(let i=0;i<state.q.sectionIndex;i++)n+=COMMON[secs[i]][sig].length;n+=state.q.itemIndex}if(state.stage==='recovery')n=SIGNALS.reduce((a,s)=>a+sectionOrder(s).reduce((b,sec)=>b+COMMON[sec][s].length,0),0)+state.q.itemIndex;return n}
function setProgress(){if(!['questions','recovery'].includes(state.stage)){progress.classList.add('hidden');return}progress.classList.remove('hidden');const total=allQuestionItemsCount(),done=completedQuestionItems();pBar.style.width=`${Math.max(2,done/total*100)}%`;if(state.stage==='recovery'){pLabel.textContent='RECOVERY // SIGNAL MAP';pCount.textContent=`${done+1} OF ${total}`}else{const sig=currentSig(),f=feelingFor(sig);pLabel.textContent=`${signalInfo[sig].label} // ${f?.label||''}`;pCount.textContent=`${done+1} OF ${total}`}}
function render(){setProgress();try{({intro:renderIntro,name:renderName,pick:renderPick,questions:renderQuestion,signalDone:renderSignalDone,recovery:renderRecovery,free:renderFree,report:renderReport}[state.stage]||renderIntro)()}catch(e){console.error(e);state=blankState();save();renderIntro()}}
function renderIntro(){app.innerHTML=`<section class="screen intro"><div class="hero-art"><img src="${asset(1)}" alt="Glorb"></div><div class="paper"><p class="eyebrow">INCOMING TRANSMISSION</p><h1>GLORB // SIGNAL MAPPER</h1><p class="lead">Pick a feeling. Tell me what happens. Tell me what helps.</p><blockquote style="margin:28px 0;padding:18px;border:1px solid #d5cab9;background:#fff">I am collecting Earth signal data. Your answers will build a plan for the adults who support you.</blockquote><button id="next" class="primary">START →</button></div></section>`;document.getElementById('next').onclick=()=>{state.stage='name';save();render()}}
function renderName(){app.innerHTML=`<section class="screen name"><div class="hero-art"><img src="${asset(1)}" alt="Glorb"></div><div class="paper"><p class="eyebrow">FIRST THING</p><h1>WHAT SHOULD I CALL YOU?</h1><input id="nm" class="name-input" maxlength="40" placeholder="Type here" value="${esc(state.name)}"><button id="next" class="primary">NEXT →</button></div></section>`;const n=document.getElementById('nm');n.focus();document.getElementById('next').onclick=()=>{state.name=n.value.trim()||'Student';state.stage='pick';save();render()}}
function renderPick(){const sig=currentSig(),s=signalInfo[sig],picked=state.picks[sig]?.id||'';const cards=FEELINGS[sig].map(f=>`<button class="feeling ${picked===f.id?'selected':''}" data-id="${f.id}"><img src="${asset(f.img)}" alt=""><strong>${esc(f.label)}</strong></button>`).join('');app.innerHTML=`<section class="screen signal-pick"><div class="paper"><div class="signal-header"><div><span class="signal-tag ${sig}">${s.label}</span><p class="eyebrow">PICK A FEELING</p><h1>WHICH ONE FEELS MOST LIKE YOU?</h1><p class="lead">Pick one. We will map this feeling together.</p></div><img src="${asset(s.img)}" alt="${s.label}"></div><div class="feeling-grid">${cards}</div><div class="other-feeling"><button id="otherBtn" class="other-tile"><div class="plus">+</div><div><strong>Something else</strong><div style="font-size:12px;color:#68717b;margin-top:4px">My feeling is not listed.</div></div></button><div class="other-input ${picked==='other'?'':'hidden'}" id="otherWrap"><label class="eyebrow">MY FEELING</label><input id="otherText" maxlength="40" placeholder="Type it here" value="${esc(state.picks[sig]?.label||'')}"></div></div><div class="pick-actions"><button id="pickNext" class="primary" ${picked?'':'disabled'}>START QUESTIONS →</button></div></div></section>`;app.querySelectorAll('.feeling').forEach(b=>b.onclick=()=>{const id=b.dataset.id,f=FEELINGS[sig].find(x=>x.id===id);state.picks[sig]={id,label:f.label};save();renderPick()});document.getElementById('otherBtn').onclick=()=>{state.picks[sig]={id:'other',label:state.picks[sig]?.id==='other'?state.picks[sig].label:''};save();renderPick()};const ot=document.getElementById('otherText');if(ot)ot.oninput=()=>{state.picks[sig].label=ot.value;save()};document.getElementById('pickNext').onclick=()=>{if(state.picks[sig]?.id==='other'&&!state.picks[sig].label.trim())return alert('Type your feeling first.');state.q={sectionIndex:0,itemIndex:0};state.stage='questions';save();render()}}
function questionPrompt(sig,sec,f,label){if(sec==='body')return `When you feel ${f.label.toLowerCase()}, does this happen?`;if(sec==='urge')return `When you feel ${f.label.toLowerCase()}, do you want to do this?`;if(sec==='bigger')return `When you feel ${f.label.toLowerCase()}, does this make it harder?`;if(sec==='self')return sig==='steady'?`Does this help you stay ${f.label.toLowerCase()}?`:`When you feel ${f.label.toLowerCase()}, does this help you?`;if(sec==='others')return `When you feel ${f.label.toLowerCase()}, does this help from someone else?`;return label}
function renderQuestion(){const sig=currentSig(),f=feelingFor(sig),secs=sectionOrder(sig),sec=secs[state.q.sectionIndex],items=COMMON[sec][sig],item=items[state.q.itemIndex];if(!item){return nextSection()}const[label,img]=item;app.innerHTML=`<section class="screen q-screen"><aside class="q-rail"><div class="stage">${signalInfo[sig].label}</div><img src="${asset(f.img)}" alt=""><p class="eyebrow" style="color:#dce5ef">RIGHT NOW</p><h3>${esc(f.label)}</h3><p>${SECTION_LABEL[sec]}</p></aside><div class="q-card"><div class="q-count">${SECTION_LABEL[sec]} // ${state.q.itemIndex+1} OF ${items.length}</div><h2>${esc(questionPrompt(sig,sec,f,label))}</h2><div class="focus-card">${img?`<img src="${asset(img)}" alt="">`:`<div style="font-size:90px;text-align:center">?</div>`}<div><div class="big-label">${esc(label)}</div></div></div><div class="yn"><button class="yes" data-val="yes">✓ YES</button><button class="no" data-val="no">✕ NO</button></div></div></section>`;app.querySelectorAll('[data-val]').forEach(b=>b.onclick=()=>{ensureAnswer(sig)[sec]??={};ensureAnswer(sig)[sec][label]=b.dataset.val==='yes';state.q.itemIndex++;save();render()})}
function nextSection(){const sig=currentSig(),secs=sectionOrder(sig);state.q.sectionIndex++;state.q.itemIndex=0;if(state.q.sectionIndex>=secs.length){state.stage='free';state.freeStep=0}else state.stage='questions';save();render()}
function renderFree(){const sig=currentSig(),f=feelingFor(sig),step=state.freeStep||0,key=step===0?'extraHelp':'important',title=step===0?'IS THERE ANYTHING ELSE THAT HELPS?':`ANYTHING IMPORTANT YOU WANT ADULTS TO KNOW WHEN YOU FEEL ${f.label.toUpperCase()}?`;state.free[sig]??={};app.innerHTML=`<section class="screen q-screen"><aside class="q-rail"><div class="stage">${signalInfo[sig].label}</div><img src="${asset(f.img)}" alt=""><p class="eyebrow" style="color:#dce5ef">${esc(f.label)}</p></aside><div class="q-card"><div class="free-card"><p class="q-count">YOUR WORDS</p><h2>${title}</h2><textarea id="txt" placeholder="You can leave this blank.">${esc(state.free[sig][key]||'')}</textarea><div class="free-actions"><button id="skip" class="ghost">SKIP</button><button id="go" class="primary">NEXT →</button></div></div></div></section>`;const advance=()=>{state.free[sig][key]=document.getElementById('txt').value.trim();if(step===0){state.freeStep=1;save();render()}else{state.freeStep=0;state.stage='signalDone';save();render()}};document.getElementById('go').onclick=advance;document.getElementById('skip').onclick=()=>{document.getElementById('txt').value='';advance()}}
function renderSignalDone(){const sig=currentSig(),f=feelingFor(sig),last=state.signalIndex===SIGNALS.length-1;app.innerHTML=`<section class="screen signal-done"><div class="paper done-card"><img src="${asset(signalInfo[sig].img)}" alt=""><p class="eyebrow">${signalInfo[sig].label} MAPPED</p><h1>${esc(f.label.toUpperCase())} ✓</h1><p>Got it. I know more about what this feeling looks like for you.</p><div class="done-actions"><button id="next" class="primary">${last?'MAP RECOVERY →':'NEXT SIGNAL →'}</button></div></div></section>`;document.getElementById('next').onclick=()=>{if(last){state.stage='recovery';state.q={itemIndex:0,sectionIndex:0}}else{state.signalIndex++;state.stage='pick'}save();render()}}
function renderRecovery(){const item=COMMON.recovery[state.q.itemIndex];if(!item){state.stage='report';save();return render()}const[label,img]=item;app.innerHTML=`<section class="screen q-screen"><aside class="q-rail"><div class="stage">AFTER OVERLOAD</div><img src="${asset(1)}" alt="Glorb"><p class="eyebrow" style="color:#dce5ef">RECOVERY</p><h3>COMING BACK DOWN</h3></aside><div class="q-card"><div class="q-count">RECOVERY // ${state.q.itemIndex+1} OF ${COMMON.recovery.length}</div><h2>After a big feeling starts to pass, is this like you?</h2><div class="focus-card"><img src="${asset(img)}" alt=""><div class="big-label">${esc(label)}</div></div><div class="yn"><button class="yes" data-val="yes">✓ YES</button><button class="no" data-val="no">✕ NO</button></div></div></section>`;app.querySelectorAll('[data-val]').forEach(b=>b.onclick=()=>{state.recovery[label]=b.dataset.val==='yes';state.q.itemIndex++;save();render()})}
function yesItems(sig,sec){const a=state.answers[sig]?.[sec]||{};return Object.keys(a).filter(k=>a[k])}function feelingLabel(sig){return feelingFor(sig)?.label||'Not selected'}function chips(arr){return arr.length?arr.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="chip">Not identified yet</span>'}
function cycleCard(sig){const f=feelingLabel(sig),body=yesItems(sig,'body').slice(0,3),self=yesItems(sig,'self').slice(0,3),others=yesItems(sig,'others').slice(0,3);return `<div class="cycle-card ${sig}"><strong>${signalInfo[sig].label}</strong><span>${esc(f)}</span><b>Signs</b>${chips(body)}<b>Helps me</b>${chips(self)}<b>Others</b>${chips(others)}</div>`}
function signalSection(sig){const f=feelingLabel(sig);return `<section class="signal-section"><header class="${sig}"><img src="${asset(signalInfo[sig].img)}" alt=""><div><h3>${signalInfo[sig].label}</h3><div class="note">${esc(state.name)} chose <strong>${esc(f)}</strong> in this signal group.</div></div></header><div class="signal-body"><div class="block"><h4>Student-identified body clues</h4><div class="chips">${chips(yesItems(sig,'body'))}</div></div><div class="block"><h4>May want to do</h4><div class="chips">${chips(yesItems(sig,'urge'))}</div></div>${sig!=='steady'?`<div class="block"><h4>Can make it build / harder</h4><div class="chips">${chips(yesItems(sig,'bigger'))}</div></div>`:''}<div class="block"><h4>Helps self</h4><div class="chips">${chips(yesItems(sig,'self'))}</div></div><div class="block"><h4>Other people can help by</h4><div class="chips">${chips(yesItems(sig,'others'))}</div></div>${state.free[sig]?.extraHelp?`<div class="student-note"><strong>Anything else that helps:</strong> ${esc(state.free[sig].extraHelp)}</div>`:''}${state.free[sig]?.important?`<div class="student-note"><strong>Important to know:</strong> ${esc(state.free[sig].important)}</div>`:''}</div></section>`}
function renderReport(){progress.classList.add('hidden');const today=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});const recovery=yesItemsRecovery();const risingEarly=yesItems('rising','body').slice(0,4),risingHelp=yesItems('rising','self').slice(0,4),risingOthers=yesItems('rising','others').slice(0,4),overHelp=yesItems('overload','self').slice(0,4),overOthers=yesItems('overload','others').slice(0,4);app.innerHTML=`<section class="screen report-screen"><div class="toolbar"><button id="edit" class="ghost">← EDIT</button><button id="print" class="primary">PRINT OR SAVE PDF</button></div><div class="report"><div class="page"><header class="report-head"><div><p class="eyebrow">ZORBAX-9 RESEARCH DIVISION // STUDENT SUPPORT</p><h1 class="report-title">${esc(state.name)}'S SIGNAL PLAN</h1></div><div class="report-id">GLORB SIGNAL MAPPER<br>${esc(today)}<br>STUDENT SELF-REPORT</div></header><div class="intro-box"><div><h3>WHAT IS THE SIGNAL SYSTEM?</h3><p class="note">The Signal System is a student-friendly way to describe changes in energy, attention, tension and thinking across the school day. It is not a diagnosis, a score or a ranking of behaviour. A student can move between signals.</p><p class="note"><strong>Steady does not mean silent, still or perfectly calm.</strong> This plan records what ${esc(state.name)} identified in each signal group and what support they said helps.</p></div><img src="${asset(7)}" alt="Signal system"></div><div class="defs">${SIGNALS.map(s=>`<div class="def ${s}"><strong>${signalInfo[s].label}</strong>${signalInfo[s].definition}</div>`).join('')}</div><div class="cycle"><p class="eyebrow">ESCALATION + RECOVERY CYCLE</p><h3>HOW ${esc(state.name).toUpperCase()}'S SIGNALS CAN BUILD AND CHANGE</h3><p class="note">Use this as a support pathway. Look for the student's identified signs, respond early when possible, and use the supports they selected.</p><svg class="cycle-curve" viewBox="0 0 1000 210" role="img" aria-label="Low to steady to rising to overload and recovery"><polyline points="70,170 280,160 500,120 720,35 930,160" fill="none" stroke="#1a2c40" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="170" r="14" fill="#aac6e3"/><circle cx="280" cy="160" r="14" fill="#a8d4c6"/><circle cx="500" cy="120" r="14" fill="#e7ba80"/><circle cx="720" cy="35" r="14" fill="#d994a4"/><circle cx="930" cy="160" r="14" fill="#cbd2d8"/></svg><div class="cycle-labels"><div class="cycle-label">LOW</div><div class="cycle-label">STEADY</div><div class="cycle-label">RISING</div><div class="cycle-label">OVERLOAD</div><div class="cycle-label">RECOVERY</div></div><div class="cycle-cards">${cycleCard('low')}${cycleCard('steady')}${cycleCard('rising')}${cycleCard('overload')}<div class="cycle-card recovery"><strong>RECOVERY / RETURN</strong><b>Student identified</b>${chips(recovery)}</div></div></div><div class="adult-summary"><p class="eyebrow">ADULT QUICK GUIDE</p><h3>EARLY SUPPORT MATTERS MOST AT RISING SIGNAL</h3><div class="summary-grid"><div class="summary-card"><strong>EARLY SIGNS</strong><div class="chips">${chips(risingEarly)}</div></div><div class="summary-card"><strong>WHAT HELPS ${esc(state.name).toUpperCase()}</strong><div class="chips">${chips(risingHelp)}</div></div><div class="summary-card"><strong>WHAT OTHERS CAN DO</strong><div class="chips">${chips(risingOthers)}</div></div></div></div><div class="adult-summary"><h3>IF THE SIGNAL REACHES OVERLOAD</h3><p class="note"><strong>Support first. Reflection later.</strong></p><div class="summary-grid"><div class="summary-card"><strong>HELPS SELF</strong><div class="chips">${chips(overHelp)}</div></div><div class="summary-card"><strong>OTHERS CAN HELP BY</strong><div class="chips">${chips(overOthers)}</div></div><div class="summary-card"><strong>RECOVERY</strong><div class="chips">${chips(recovery)}</div></div></div></div><p class="note"><strong>Use note:</strong> This is a formative student self-report and collaborative planning tool, not a clinical diagnostic assessment. Review it with the student and combine it with adult observation and any existing support, health or safety plans.</p></div><div class="page page-break">${SIGNALS.map(signalSection).join('')}<section class="signal-section"><header><img src="${asset(1)}" alt="Glorb"><div><h3>RECOVERY / RETURN</h3><div class="note">What ${esc(state.name)} identified after a big feeling starts to pass.</div></div></header><div class="signal-body"><div class="block" style="grid-column:1/-1"><h4>Recovery needs</h4><div class="chips">${chips(recovery)}</div></div></div></section></div></div></section>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('edit').onclick=()=>{state.signalIndex=0;state.stage='pick';save();render()}}
function yesItemsRecovery(){return Object.keys(state.recovery||{}).filter(k=>state.recovery[k])}
document.getElementById('startOver').onclick=()=>{if(confirm('Start over and clear this plan?'))reset()};document.getElementById('readBtn').onclick=()=>{if(!('speechSynthesis'in window))return alert('Read Aloud is not supported in this browser.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(app.innerText.replace(/\s+/g,' ').trim());u.rate=.95;speechSynthesis.speak(u)};
render();
</script>
</body>
</html>
