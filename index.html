<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07182d" />
  <title>GLORB // Signal Mapper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar no-print">
      <div class="brand">ZORBAX-9 RESEARCH DIVISION</div>
      <div class="top-actions">
        <button id="readBtn" class="text-btn" type="button" aria-label="Read this screen aloud">🔊 READ ALOUD</button>
        <button id="clearBtn" class="text-btn" type="button">START OVER</button>
      </div>
    </header>
    <div id="progressWrap" class="progress-wrap no-print hidden" aria-label="Progress">
      <div class="progress-meta"><span id="progressLabel">MY MAP</span><span id="progressCount"></span></div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    </div>
    <main id="app" class="app" aria-live="polite"></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
